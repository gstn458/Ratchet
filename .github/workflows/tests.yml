name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Before any install, so this proves the scanner runs on a bare interpreter.
      - name: Scanner runs with no dependencies
        run: python -I ratchet.py tests/fixtures --json > /dev/null
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (regex Go backend only)
        run: python -m pytest -v
      - name: Install tree-sitter
        run: python -m pip install -r requirements-treesitter.txt
      - name: Run tests (tree-sitter Go backend too)
        run: python -m pytest -v

  package:
    # The wheel installs a working ratchet command whose output matches the
    # source file's: same registry, same findings, nothing left behind.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build -o dist .
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/pip install dist/*.whl
      - name: Installed command matches the source
        run: |
          /tmp/installed/bin/ratchet --version
          normalise='import json,sys; d=json.load(sys.stdin); d["serialNumber"]=d["metadata"]["timestamp"]=""; print(json.dumps(d, sort_keys=True))'
          (cd /tmp && /tmp/installed/bin/ratchet "$GITHUB_WORKSPACE/tests/fixtures/walk/mixed" --json) | python -c "$normalise" > /tmp/installed.json
          python ratchet.py tests/fixtures/walk/mixed --json | python -c "$normalise" > /tmp/source.json
          cmp /tmp/installed.json /tmp/source.json
          # -I keeps the workspace, which holds ratchet.py and registry.json,
          # off sys.path, so this imports the installed module.
          source="$(/tmp/installed/bin/python -I -c 'import ratchet; print(ratchet.REGISTRY_SOURCE)')"
          echo "installed registry source: $source"
          test "$source" = embedded

  action:
    # The action as a user runs it, on each runner OS. On a pull request it
    # also checks out the base and compares; on a push it reports only.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - id: ratchet
        uses: ./
        with:
          path: tests/fixtures/walk/mixed
          fail-on: none
      - name: Outputs are set
        shell: bash
        env:
          CBOM: ${{ steps.ratchet.outputs.cbom }}
          SARIF: ${{ steps.ratchet.outputs.sarif }}
          FAILED: ${{ steps.ratchet.outputs.failed }}
          VULNERABLE: ${{ steps.ratchet.outputs.vulnerable }}
          NEW_VULNERABLE: ${{ steps.ratchet.outputs.new-vulnerable }}
          EVENT: ${{ github.event_name }}
        run: |
          test -s "$CBOM"
          test -s "$SARIF"
          test "$FAILED" = false
          test "$VULNERABLE" -gt 0
          if [ "$EVENT" = pull_request ]; then test -n "$NEW_VULNERABLE"; else test -z "$NEW_VULNERABLE"; fi
